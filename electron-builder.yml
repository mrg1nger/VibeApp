appId: com.vibeapp.desktop
productName: VibeApp
directories:
  buildResources: build
  output: release
files:
  # Only the app itself: never test bundles, logs or screenshots that may be in out/.
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - '!out/main/_test-*'
  - package.json
asarUnpack:
  - '**/node_modules/node-pty/**/*'
  - '**/node_modules/@anthropic-ai/**/*'
npmRebuild: false
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
